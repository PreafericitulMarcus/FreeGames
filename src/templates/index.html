<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
	  href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main
      id="main-content"
      class="game-grid"
      role="main"
      aria-label="List of free games"
    >
      <div id="aria-live" aria-live="polite" class="visually-hidden"></div>

      {% for game in games %}

      <a
        href="{{ game.url }}"
        target="_blank"
        class="game-card"
        aria-label="{{ game.title }} — {{ game.source }} — Ends in {{ game.countdown }}"
      >
        <article
          class="card-content"
          role="article"
          aria-labelledby="title-{{ loop.index }}"
        >
          <img
            src="{{ game.image_url }}"
            alt="{{ game.title }} cover"
            class="game-image"
          />

          <div class="game-info">
            <p id="title-{{ loop.index }}" class="game-title">
              {{ game.title }}
            </p>  
            <small class="game-countdown" aria-hidden="true"
              >Ends in: {{ game.countdown }}</small
            >
            <small class="game-source">Source: {{ game.source }}</small>
          </div>
        </article>
      </a>

      {% endfor %} {% if not games %}
      <p class="no-games">
        No free games are currently available. Check back soon!
      </p>
      {% endif %}
    </main>
  </body>
</html>
